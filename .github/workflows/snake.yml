name: snake

on:
  schedule:
    - cron: "0 0 * * *"   # every day 05:00 Tashkent
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate monochrome snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0a0a0a&color_dots=#ebedf0,#c4c4c4,#8a8a8a,#4a4a4a,#1a1a1a
            dist/snake-dark.svg?color_snake=#ffffff&color_dots=#161616,#2e2e2e,#5a5a5a,#9a9a9a,#e6e6e6

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
